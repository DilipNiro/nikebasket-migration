# docker-compose.yml — Environnement complet NikeBasket
# --------------------------------------------------------
# Lance 6 services en une seule commande : docker-compose up
#   - postgres   : base de données PostgreSQL
#   - redis      : cache (endpoints lents)
#   - backend    : API REST Node.js/Express (port 3001)
#   - frontend   : SPA React via Vite (port 5173)
#   - prometheus : collecte des métriques (port 9090)
#   - grafana    : dashboards de monitoring (port 3000)
#
# Usage :
#   docker-compose up         # Démarrer en arrière-plan
#   docker-compose down       # Arrêter et supprimer les conteneurs
#   docker-compose logs -f    # Voir les logs en temps réel

version: '3.9'

services:

  # -- Base de données PostgreSQL -----------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nikebasket_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Cache Redis --------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nikebasket_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Backend Node.js/Express --------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nikebasket_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:      development
      PORT:          3001
      PG_HOST:       postgres
      PG_PORT:       5432
      PG_USER:       postgres
      PG_PASSWORD:   postgres
      PG_DATABASE:   ecommerce
      JWT_SECRET:    dev_secret_changez_en_production_32chars
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL:  http://localhost:5173
      REDIS_URL:     redis://redis:6379
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads

  # -- Frontend React/Vite ------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nikebasket_front
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # -- Prometheus (collecte des métriques) --------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: nikebasket_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # -- Grafana (dashboards de monitoring) ---------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: nikebasket_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     'false'
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
  grafana_data:
